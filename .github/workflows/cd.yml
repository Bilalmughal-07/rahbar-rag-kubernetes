name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push immutable SHA-tagged images
        run: |
          set -euo pipefail
          docker build -t "$IMAGE_REGISTRY/rahbar-api:$IMAGE_TAG" api
          docker build -t "$IMAGE_REGISTRY/rahbar-indexer:$IMAGE_TAG" indexer
          docker build -t "$IMAGE_REGISTRY/rahbar-ui:$IMAGE_TAG" ui
          docker push "$IMAGE_REGISTRY/rahbar-api:$IMAGE_TAG"
          docker push "$IMAGE_REGISTRY/rahbar-indexer:$IMAGE_TAG"
          docker push "$IMAGE_REGISTRY/rahbar-ui:$IMAGE_TAG"
          echo "Published SHA: $IMAGE_TAG"

  deploy:
    needs: build-push
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create ephemeral deployment cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: kind
          node_image: kindest/node:v1.31.4
      - name: Install pinned ingress-nginx controller
        run: |
          kubectl label nodes --all ingress-ready=true --overwrite
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=Ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s
      - name: Pull and load the exact published images
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REGISTRY/rahbar-api:$IMAGE_TAG"
          docker pull "$IMAGE_REGISTRY/rahbar-indexer:$IMAGE_TAG"
          docker pull "$IMAGE_REGISTRY/rahbar-ui:$IMAGE_TAG"
          kind load docker-image "$IMAGE_REGISTRY/rahbar-api:$IMAGE_TAG"
          kind load docker-image "$IMAGE_REGISTRY/rahbar-indexer:$IMAGE_TAG"
          kind load docker-image "$IMAGE_REGISTRY/rahbar-ui:$IMAGE_TAG"
      - name: Render and apply the exact SHA-tagged deployment
        run: |
          set -euo pipefail
          kustomize_root="$RUNNER_TEMP/rahbar-k8s"
          mkdir -p "$kustomize_root/overlays"
          cp -R k8s/base "$kustomize_root/base"
          cp -R k8s/overlays/prod "$kustomize_root/overlays/prod"
          overlay="$kustomize_root/overlays/prod"
          sed -i "s|OWNER|$IMAGE_REGISTRY|g; s|PLACEHOLDER_SHA|$IMAGE_TAG|g" "$overlay/kustomization.yaml"
          kubectl apply -k "$overlay"
          kubectl -n rahbar patch configmap rahbar-config --type merge -p \
            '{"data":{"EMBED_PROVIDER":"hash","EMBED_MODEL":"ci-hash-512","LLM_PROVIDER":"stub","RETRIEVER":"chroma","RELEVANCE_FLOOR":"0.15","CACHE_ENABLED":"false"}}'
          kubectl -n rahbar delete job indexer --ignore-not-found --wait=true
      - name: Load fixture corpus for the ephemeral smoke deployment
        run: |
          set -euo pipefail
          kubectl -n rahbar create configmap fixture-corpus \
            --from-file=academic-rules-2023.md=eval/fixtures/academic-rules-2023.md \
            --from-file=academic-rules-2026.md=eval/fixtures/academic-rules-2026.md \
            --from-file=fees-2026.md=eval/fixtures/fees-2026.md \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n rahbar create -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: fixture-loader
          spec:
            restartPolicy: Never
            containers:
              - name: loader
                image: busybox:1.36
                command: ["sh", "-c", "cp /fixtures/* /corpus/"]
                volumeMounts:
                  - {name: fixtures, mountPath: /fixtures, readOnly: true}
                  - {name: corpus, mountPath: /corpus}
            volumes:
              - name: fixtures
                configMap: {name: fixture-corpus}
              - name: corpus
                persistentVolumeClaim: {claimName: corpus-data}
          EOF
          kubectl -n rahbar wait --for=jsonpath='{.status.phase}'=Succeeded \
            pod/fixture-loader --timeout=180s
          kubectl -n rahbar delete pod fixture-loader --wait=true
      - name: Index fixture corpus and wait for rollouts
        run: |
          set -euo pipefail
          kubectl create job --from=cronjob/reindex fixture-index -n rahbar
          kubectl wait --for=condition=complete job/fixture-index -n rahbar --timeout=300s
          kubectl -n rahbar rollout restart deployment/api
          kubectl -n rahbar rollout status statefulset/chroma --timeout=180s
          kubectl -n rahbar rollout status deployment/redis --timeout=180s
          kubectl -n rahbar rollout status deployment/ui --timeout=180s
          kubectl -n rahbar rollout status deployment/api --timeout=180s
      - name: Verify deployed image SHA
        run: |
          set -euo pipefail
          test "$(kubectl -n rahbar get deployment/api -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$IMAGE_REGISTRY/rahbar-api:$IMAGE_TAG"
          test "$(kubectl -n rahbar get deployment/ui -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$IMAGE_REGISTRY/rahbar-ui:$IMAGE_TAG"
          test "$(kubectl -n rahbar get cronjob/reindex -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].image}')" = "$IMAGE_REGISTRY/rahbar-indexer:$IMAGE_TAG"
          echo "Deployed SHA: $IMAGE_TAG"
      - name: Smoke test through Ingress with a real API request
        run: |
          set -euo pipefail
          kubectl -n ingress-nginx port-forward service/ingress-nginx-controller 8080:80 >/tmp/rahbar-ingress.log 2>&1 &
          ingress_pid=$!
          trap 'kill "$ingress_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --header 'Host: rahbar.local' \
              http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          python scripts/routing_smoke.py \
            --base-url http://127.0.0.1:8080 \
            --host rahbar.local
      - name: Collect deployment diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get jobs -n rahbar -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl -n rahbar logs job/fixture-index --all-containers=true || true
          kubectl -n rahbar logs deployment/api --all-containers=true --tail=200 || true
          cat /tmp/rahbar-ingress.log || true
