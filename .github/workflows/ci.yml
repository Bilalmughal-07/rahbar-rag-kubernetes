name: ci

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            indexer/requirements-dev.txt
      - name: Install Python tools and project dependencies
        run: |
          python -m pip install -r api/requirements-dev.txt
          python -m pip install -r indexer/requirements-dev.txt
      - name: Ruff
        run: ruff check api indexer eval corpus
      - name: Mypy
        run: mypy --cache-dir=/dev/null --config-file mypy.ini api/app indexer/pipeline
      - name: UI static checks
        run: |
          test -s ui/index.html
          test -s ui/nginx.conf

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            indexer/requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r api/requirements-dev.txt
          python -m pip install -r indexer/requirements-dev.txt
          python -m pip install pytest-cov
      - name: API tests with coverage gate
        run: |
          python -m pytest -q api --cov=api/app --cov-report=term-missing \
            --cov-report=xml:coverage-api.xml --cov-fail-under=60
      - name: Indexer and evaluation tests
        run: python -m pytest -q indexer eval
      - name: Upload API coverage report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: api-coverage-${{ github.sha }}
          path: coverage-api.xml
          if-no-files-found: ignore

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: azure/setup-kubectl@v4.0.0
        with:
          version: v1.31.4
      - name: Render production overlay
        run: kubectl kustomize k8s/overlays/prod > rahbar.yaml
      - name: Validate rendered manifests strictly
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary rahbar.yaml
      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4.6.2
        with:
          name: manifests-${{ github.sha }}
          path: rahbar.yaml

  build:
    needs: [lint, test, manifests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build API image
        run: docker build -t rahbar-api:${{ env.IMAGE_TAG }} api
      - name: Build indexer image
        run: docker build -t rahbar-indexer:${{ env.IMAGE_TAG }} indexer
      - name: Build UI image
        run: docker build -t rahbar-ui:${{ env.IMAGE_TAG }} ui

  scan:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Rebuild images in the scan runner
        run: |
          docker build -t rahbar-api:${{ env.IMAGE_TAG }} api
          docker build -t rahbar-indexer:${{ env.IMAGE_TAG }} indexer
          docker build -t rahbar-ui:${{ env.IMAGE_TAG }} ui
      - name: Scan API image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rahbar-api:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan indexer image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rahbar-indexer:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan UI image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rahbar-ui:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e-eval:
    needs: [build, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: kind
          node_image: kindest/node:v1.31.4
      - name: Install pinned ingress-nginx controller
        run: |
          kubectl label nodes --all ingress-ready=true --overwrite
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=Ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s
      - name: Build and load application images
        run: |
          docker build -t rahbar-api:${{ env.IMAGE_TAG }} api
          docker build -t rahbar-indexer:${{ env.IMAGE_TAG }} indexer
          docker build -t rahbar-ui:${{ env.IMAGE_TAG }} ui
          docker tag rahbar-api:${{ env.IMAGE_TAG }} rahbar-api:dev
          docker tag rahbar-indexer:${{ env.IMAGE_TAG }} rahbar-indexer:dev
          docker tag rahbar-ui:${{ env.IMAGE_TAG }} rahbar-ui:dev
          kind load docker-image rahbar-api:dev
          kind load docker-image rahbar-indexer:dev
          kind load docker-image rahbar-ui:dev
          kubectl apply -k k8s/overlays/dev
          kubectl -n rahbar patch configmap rahbar-config --type merge -p \
            '{"data":{"EMBED_PROVIDER":"hash","EMBED_MODEL":"ci-hash-512","LLM_PROVIDER":"stub","RETRIEVER":"chroma","RELEVANCE_FLOOR":"0.15","CACHE_ENABLED":"false"}}'
          kubectl -n rahbar delete job indexer --ignore-not-found --wait=true
      - name: Load fixture corpus into the PVC
        run: |
          kubectl -n rahbar create configmap fixture-corpus \
            --from-file=academic-rules-2023.md=eval/fixtures/academic-rules-2023.md \
            --from-file=academic-rules-2026.md=eval/fixtures/academic-rules-2026.md \
            --from-file=fees-2026.md=eval/fixtures/fees-2026.md \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n rahbar delete pod fixture-loader --ignore-not-found --wait=true
          kubectl -n rahbar create -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: fixture-loader
          spec:
            restartPolicy: Never
            containers:
              - name: loader
                image: busybox:1.36
                command: ["sh", "-c", "cp /fixtures/* /corpus/"]
                volumeMounts:
                  - {name: fixtures, mountPath: /fixtures, readOnly: true}
                  - {name: corpus, mountPath: /corpus}
            volumes:
              - name: fixtures
                configMap: {name: fixture-corpus}
              - name: corpus
                persistentVolumeClaim: {claimName: corpus-data}
          EOF
          kubectl -n rahbar wait --for=jsonpath='{.status.phase}'=Succeeded \
            pod/fixture-loader --timeout=180s
          kubectl -n rahbar delete pod fixture-loader --wait=true
      - name: Index fixture corpus
        run: |
          kubectl create job --from=cronjob/reindex fixture-index -n rahbar
          kubectl wait --for=condition=complete job/fixture-index -n rahbar --timeout=300s
          kubectl -n rahbar rollout restart deployment/api
          kubectl -n rahbar rollout status statefulset/chroma --timeout=180s
          kubectl -n rahbar rollout status deployment/redis --timeout=180s
          kubectl -n rahbar rollout status deployment/ui --timeout=180s
          kubectl -n rahbar rollout status deployment/api --timeout=180s
      - name: Verify API and Ingress routing
        run: |
          kubectl -n ingress-nginx port-forward service/ingress-nginx-controller 8080:80 >/tmp/ingress.log 2>&1 &
          ingress_pid=$!
          trap 'kill "$ingress_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --header 'Host: rahbar.local' \
              http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          python scripts/routing_smoke.py \
            --base-url http://127.0.0.1:8080 \
            --host rahbar.local
      - name: Run fixture evaluation through Ingress
        run: |
          set -euo pipefail
          kubectl -n ingress-nginx port-forward service/ingress-nginx-controller 8080:80 >/tmp/ingress-eval.log 2>&1 &
          ingress_pid=$!
          trap 'kill "$ingress_pid"' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --header 'Host: rahbar.local' \
              http://127.0.0.1:8080/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          python -m pip install httpx pyyaml
          python eval/run_eval.py --api http://127.0.0.1:8080 --host rahbar.local \
            --golden eval/fixtures/golden.fixture.yaml \
            --out /tmp/results.json \
            --baseline eval/fixtures/baseline.fixture.json
      - name: Upload fixture evaluation result
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: fixture-evaluation-${{ github.sha }}
          path: /tmp/results.json
          if-no-files-found: ignore
      - name: Collect cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get jobs -n rahbar -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl -n rahbar logs job/fixture-index --all-containers=true || true
          kubectl -n rahbar logs deployment/api --all-containers=true --tail=200 || true
          cat /tmp/ingress.log || true
