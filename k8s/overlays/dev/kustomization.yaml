apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ollama-egress.yaml
patches:
  # Resume explicitly after copying and verifying the corpus on a fresh cluster.
  - target:
      kind: Job
      name: indexer
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
images:
  - name: rahbar-api
    newName: rahbar-api
    newTag: dev
  - name: rahbar-indexer
    newName: rahbar-indexer
    newTag: dev
  - name: rahbar-ui
    newName: rahbar-ui
    newTag: dev
