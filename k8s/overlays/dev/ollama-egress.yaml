apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama-egress
  namespace: rahbar
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [api, indexer]
  policyTypes: [Egress]
  egress:
    # Docker Desktop exposes the Windows host through host.docker.internal.
    # This development-only rule permits the Ollama port without weakening prod.
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 11434}]
