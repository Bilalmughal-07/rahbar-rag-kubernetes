apiVersion: v1
kind: Pod
metadata:
  name: corpus-loader
  namespace: rahbar
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      volumeMounts:
        - name: corpus
          mountPath: /corpus
  volumes:
    - name: corpus
      persistentVolumeClaim: {claimName: corpus-data}
